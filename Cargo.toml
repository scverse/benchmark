[package]
name = "benchmark"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.103"
askama = "0.16.0"
axum = { version = "0.8.9", features = ["http2", "tokio", "tracing", "macros"] }
axum-github-webhook-extract = "0.3.0"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
futures = "0.3.32"
git2 = "0.21.0"
http = "1.4.2"
jsonwebtoken = "10.4.0"
octocrab = { version = "0.54.0", features = ["stream", "tracing"] }
regex = "1.13.0"
secrecy = "0.10.3"
serde = { version = "1.0.196", features = ["derive"] }
serde_json5 = "0.2.1"
tap = "1.0.1"
# macros, rt-multi-thread for #[tokio::main]
tokio = { version = "1.52.3", features = ["rt-multi-thread", "process"] }
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde_json = "1.0.150"

[target.'cfg(target_os = "linux")'.dependencies]
libsystemd = "0.7.0"

[dev-dependencies]
rstest = "0.26.1"
assert-json-diff = "2.0.2"
wiremock = "0.6.5"
temp-env = "0.3.6"
test-temp-dir = "0.8.0"
# transitive deps we use directly
http = "1.0.0"
hmac-sha256 = "1.1.14"
hex = "0.4.3"
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.0"
